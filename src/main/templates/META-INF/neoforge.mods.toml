modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="CyberBound"
description='''
Serverspezifische Ergaenzungen fuer den ComServer (NeoForge 1.21.1):

- Verzauberung "Verstaerkter Brecher": baut Verstaerkten Tiefenschiefer zwoelfmal
  schneller ab und laesst ihn sich selbst droppen. Ohne sie dauert ein Block
  82 Sekunden und droppt nichts.
- Rezepte fuer Inhalte, die in dieser Welt hinter nie generierten Biomen liegen
  (Blasseiche, Schwefel, Zinnober) sowie fuer den Blitzstab, dessen Gewitter-Ritual
  durch Weather2 nicht ausloesen kann.

Alle Rezepte sind normale Werkbank-Rezepte und damit in JEI sichtbar; was im Code
steckt, ist als JEI-Informationsseite hinterlegt.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# JEI ist optional: ohne JEI laeuft alles, es fehlen nur die Rezeptansicht und die
# Informationsseiten. Muss NACH JEI laden, damit das Plugin gefunden wird.
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    reason="Zeigt die Rezepte und die Informationsseiten zu Verstaerktem Tiefenschiefer, Schwefel, Zinnober und Blasseiche an."
    versionRange="[19.0.0,)"
    ordering="AFTER"
    side="CLIENT"
